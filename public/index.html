<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Surfside Garage Sale Map</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<!-- DataTables -->
<link href="https://cdn.datatables.net/2.3.0/css/dataTables.bootstrap5.min.css" rel="stylesheet">
<script src="https://cdn.datatables.net/2.3.0/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.3.0/js/dataTables.bootstrap5.min.js"></script>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- lightGallery -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lightgallery-bundle.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lg-thumbnail.min.css">
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/lightgallery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/thumbnail/lg-thumbnail.min.js"></script>

<link rel="stylesheet" href="css/styles.css">

<script src="js/common.js"></script>

</head>

<body>

<div id="nav-container"></div>

<div class="container">


<div class="row">

<div class="col-md-5">
    <table id="table" class="table table-striped w-100"></table>
</div>

<div class="col-md-7">
    <div id="map"></div>
</div>

</div>

</div>

<!-- ✅ FILTER MODAL -->
<div class="modal fade" id="filterModal">
<div class="modal-dialog">
<div class="modal-content">

<div class="modal-header">
    <h5>Filters</h5>
    <button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<input id="filterText" class="form-control mb-3" placeholder="Search items">

<label class="fw-bold">Participating Days</label>

<div id="dayFilters" class="d-flex gap-2 flex-wrap mb-3">
  <button type="button" class="btn btn-outline-secondary filter-day" data-day="June 11">June 11</button>
  <button type="button" class="btn btn-outline-secondary filter-day" data-day="June 12">June 12</button>
  <button type="button" class="btn btn-outline-secondary filter-day" data-day="June 13">June 13</button>
  <button type="button" class="btn btn-outline-secondary filter-day" data-day="June 14">June 14</button>
</div>


</div>

<div class="modal-footer">
    <button onclick="applyFilters()" data-bs-dismiss="modal" class="btn btn-primary">Apply</button>
</div>

</div>
</div>
</div>

<div id="gallery"></div>

<div id="toast-container" class="position-fixed top-0 end-0 p-3"></div>

<script>

let map = L.map('map').setView([41.6595, -81.4487], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markerGroup = L.layerGroup().addTo(map);
let table;
let currentData = [];



/* ==========================
   SHORT ADDRESS
========================== */
function getShortAddress(addr){
    return (addr || '').split(',')[0];
}

/* ==========================
   LOAD DATA
========================== */
async function loadData(){

    const res = await fetch('/api/public-submissions');
    const data = await res.json();

    currentData = data;

    render(data);
}

/* ==========================
   RENDER MAP + TABLE
========================== */
function render(data){

    markerGroup.clearLayers();

    if (table){
        table.destroy();
        $('#table').empty();
    }

    const rows = [];
    const bounds = [];

    data.forEach(row => {

        const lat = parseFloat(row.latitude);
        const lng = parseFloat(row.longitude);

        const photos = JSON.parse(row.photos || '[]');
        const days = JSON.parse(row.participating_days || '[]');

        if (!isNaN(lat) && !isNaN(lng)) {

            const marker = L.marker([lat, lng])
                .addTo(markerGroup)
                .bindPopup(`
                    <div>
                        <strong>${getShortAddress(row.address)}</strong><br>
                        ${row.items}<br>
                        <small>${days.join(', ')}</small><br>
                        ${
                            photos.length
                            ? `<button class="btn btn-sm btn-primary mt-2"
                                onclick="openGallery(${row.id})">View Photos</button>`
                            : ''
                        }
                    </div>
                `);

            row._marker = marker;
            bounds.push([lat,lng]);
        }

        rows.push([
            getShortAddress(row.address),
            row.items,
            days.join(', ')
        ]);
    });

    table = new DataTable('#table', {
        data: rows,
        columns: [
            { title: "Address" },
            { title: "Items" },
            { title: "Days" }
        ],

        searching: false,

        layout: {
            topStart: 'pageLength',

            topEnd: {
                div: {
                    html: `
                        <button class="btn btn-outline-primary btn-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#filterModal">
                            Filters
                        </button>
                    `
                }
            }
        }
    });


    $('#table tbody').on('click','tr', function(){
        const row = data[table.row(this).index()];
        map.setView(row._marker.getLatLng(), 17);
        row._marker.openPopup();
    });

    if(bounds.length){
        map.fitBounds(bounds,{padding:[40,40],maxZoom:17});
    }
}

/* ==========================
   FILTER LOGIC
========================== */
function applyFilters(){

    const text = document.getElementById('filterText').value.toLowerCase();

    const selectedDays = [...document.querySelectorAll('.filter-day.active')]
        .map(b => b.dataset.day);


    const filtered = currentData.filter(item => {

        const matchesText =
            !text ||
            (item.items || '').toLowerCase().includes(text);

        const itemDays = JSON.parse(item.participating_days || '[]');

        const matchesDays =
            !selectedDays.length ||
            itemDays.some(d => selectedDays.includes(d));

        return matchesText && matchesDays;
    });

    render(filtered);
}

/* ==========================
   PHOTO GALLERY
========================== */
window.openGallery = function(id){

    const row = currentData.find(x => x.id === id);
    if(!row) return;

    const photos = JSON.parse(row.photos || '[]');

    const container = document.getElementById('gallery');

    const lg = lightGallery(container, {
        dynamic: true,
        dynamicEl: photos.map(p => ({
            src: '/' + p,
            thumb: '/' + p
        })),
        plugins:[lgThumbnail],
        thumbnail:true
    });

    lg.openGallery(0);
}

/* ==========================
   START
========================== */
loadData();

document.querySelectorAll('.filter-day').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('active');
    applyFilters();
  });
});

</script>

</body>
</html>
